[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntx"
version = "5.4.66"

description = "Symmetric diffeomorphic and affine image registration methods in PyTorch and JAX"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "syntx developers"}
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "antspyx",
    "torch",
    "torchvision",
    "jax",
    "jaxlib"
]

[project.scripts]
syntx = "syntx.cli:main"
syntx-benchmark = "syntx.benchmark.cli:main"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["syntx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Coverage instrumentation adds real per-call overhead (measured ~2.5x slowdown on a
# small sample) and isn't needed for routine runs -- it used to be baked into every
# invocation via addopts. Run it explicitly when you actually want a coverage report:
#   pytest --cov=syntx --cov-report=term-missing
# For parallel execution across independent test files (pytest-xdist, now a test dep):
#   pytest -n auto
# Left out of addopts by default since some tests hit the same MPS/GPU device and may
# not be safe to run fully concurrently without verification.
addopts = ""
