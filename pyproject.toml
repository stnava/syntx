[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syntx"
version = "6.30.2"
description = "Symmetric diffeomorphic and affine image registration methods in PyTorch and JAX"

readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "syntx developers"}
]
dependencies = [
    "numpy>=1.24",         # Array primitives and affine algebra
    "scipy>=1.10",         # Spatial filtering and special functions
    "matplotlib>=3.7",     # Diagnostic report figure rendering
    "antspyx>=0.5.4",      # ANTsImage I/O and transform containers
    "torch>=2.1",          # PyTorch tensor and autograd engine
    "torchvision>=0.16",   # Feature extractors
    "jax>=0.4",            # JAX array and JIT engine
    "jaxlib>=0.4",         # JAX runtime library
    "pandas>=2.0",         # Tabular metrics and overlap tables
    "antsxqc>=0.4.0",      # Single judge for registration and modality QC; 0.4.0: FD censoring catalog keys
]

[project.scripts]
syntx = "syntx.cli:main"
syntx-benchmark = "syntx.benchmark.cli:main"

[project.optional-dependencies]
# Pretrained deep-feature metrics (ResNet-10 MedicalNet, Swin ViT) fetch their weights through
# antsxdata; the registration engine itself does not need it.
features = [
    "antsxdata>=0.2.0",    # Canonical asset registry for pretrained weights
]
test = [
    "pytest>=8.0",         # Test runner
    "pytest-cov>=5.0",     # Coverage plugin
    "pytest-xdist>=3.5",   # Parallel test execution
    "ruff>=0.4",           # Linter and formatter
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["syntx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: end-to-end 3D registrations and multi-pair benchmarks (run with -m slow)",
]
addopts = ""

[tool.ruff]
line-length = 120
target-version = "6.25.0"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
